services:
  init:
    build: 
      context: .
      dockerfile: ./docker/init/Dockerfile
    volumes:
      - site:/site
      - database:/database
  nginx:
    image: nginx:latest
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
      - site:/var/www/html:ro
    depends_on:
      - app
  app:
    build: 
      context: .
      dockerfile: ./docker/php-fpm/Dockerfile
    environment:
      APP_WWW: ${APP_WWW:-http://localhost/}
      APP_DBNAME: ${APP_DBNAME:-endgame.20220115.sqlite}
      APP_DEBUG: ${APP_DEBUG:-true}
    volumes:
      - ./docker/php-fpm/php-additional.ini:/usr/local/etc/php/conf.d/php-additional.ini
      - site:/var/www/html
      - database:/database
    depends_on:
      - init

volumes:
  site:
  database:
